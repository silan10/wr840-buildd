name: Build WR840N v4 with USB (23.05.6)

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Get source
        run: |
          git clone --depth 1 --branch v23.05.6 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable USB in DTS
        run: |
          cd openwrt
          F=target/linux/ramips/dts/mt7628an_tplink_tl-wr840n-v4.dts
          sed -i '/^&ehci {/,/^};/ s/"disabled"/"okay"/' $F
          sed -i '/^&ohci {/,/^};/ s/"disabled"/"okay"/' $F
          echo "=== DTS check ==="
          grep -A2 -E "&ehci|&ohci" $F

      - name: Official config + USB + kmods
        run: |
          cd openwrt
          wget -q https://downloads.openwrt.org/releases/23.05.6/targets/ramips/mt76x8/config.buildinfo -O .config

          # Clean multi-profile / all-device settings
          sed -i \
            -e '/CONFIG_ALL=/d' \
            -e '/CONFIG_ALL_NONSHARED/d' \
            -e '/CONFIG_TARGET_MULTI_PROFILE/d' \
            -e '/CONFIG_TARGET_ALL_PROFILES/d' \
            -e '/CONFIG_TARGET_PER_DEVICE_ROOTFS/d' \
            -e '/_DEVICE_/d' \
            -e '/CONFIG_TARGET_DEVICE_/d' \
            .config

          cat << 'EOF' >> .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_tl-wr840n-v4=y

          # Keep image small
          # CONFIG_IB is not set
          # CONFIG_SDK is not set
          # CONFIG_MAKE_TOOLCHAIN is not set

          # LuCI
          CONFIG_PACKAGE_luci=y

          # Build (almost) all kmods as packages – they stay out of the image
          CONFIG_ALL_KMODS=y

          # Explicit USB support (host controller + storage + common gadgets)
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-ehci=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_usbutils=y
          EOF

          make defconfig

          echo "=== Config check ==="
          grep -E "DEVICE_tplink_tl-wr840n-v4|PACKAGE_luci=|ALL_KMODS|kmod-usb|CONFIG_ALL=" .config || true

      - name: Build
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc) || make -j1 V=s

      - name: Show error details
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s 2>&1 | tail -n 80

      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: wr840n-v4-usb-firmware
          path: |
            openwrt/bin/targets/ramips/mt76x8/*tl-wr840n-v4*
          if-no-files-found: error

      - name: Upload packages (kmods + extras)
        uses: actions/upload-artifact@v4
        with:
          name: wr840n-v4-packages
          path: |
            openwrt/bin/packages/*/base/*.ipk
            openwrt/bin/packages/*/packages/*.ipk
            openwrt/bin/targets/ramips/mt76x8/packages/*.ipk
          if-no-files-found: warn
