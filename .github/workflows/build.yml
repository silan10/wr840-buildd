name: Build WR840N v4 with USB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Get source
        run: |
          git clone --depth 1 --branch v25.12.2 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable USB in dts
        run: |
          cd openwrt
          F=target/linux/ramips/dts/mt7628an_tplink_tl-wr840n-v4.dts
          sed -i '/^&ehci {/,/^};/ s/"disabled"/"okay"/' $F
          sed -i '/^&ohci {/,/^};/ s/"disabled"/"okay"/' $F
          grep -A2 -E "&ehci|&ohci" $F

      - name: Minimal config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_tl-wr840n-v4=y
          # CONFIG_IB is not set
          # CONFIG_SDK is not set
          # CONFIG_MAKE_TOOLCHAIN is not set
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-ath9k-htc=y
          EOF
          make defconfig
          grep -E "DEVICE_tplink_tl-wr840n-v4|usb2|ath9k-htc" .config

      - name: Build
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc)

      - name: Show error details
        if: failure()
        run: |
          cd openwrt
          make -j1 V=s 2>&1 | tail -n 60

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: wr840n-v4-usb
          path: openwrt/bin/targets/ramips/mt76x8/*tl-wr840n-v4*
